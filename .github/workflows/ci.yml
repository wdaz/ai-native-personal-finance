name: CI

# Every action is pinned to a full commit SHA, with the release it was resolved from in a
# trailing comment (T-13d F8; the repository's `sha_pinning_required` setting enforces it).
# `.github/dependabot.yml` keeps the pins current.
#
# A job's `name:` (and the E2E matrix label) is the name of its status check. Anything that
# refers to a check by that string, such as a branch ruleset's required status checks, has to
# change with it, or the renamed check is never reported and the pull request waits forever.

on:
  pull_request:
  push:
    # ADR-0007 names `main` as the production branch, and it is this repository's default
    # branch (owner decision 2026-09-22, T-02a plan gate).
    branches: [main]

permissions:
  contents: read

concurrency:
  # A pull-request run is superseded by the next push to that PR. A push to `main` never
  # cancels another: its group is its own commit, so each merge keeps its verdict (backlog
  # T-13, PR #4 — a follow-up merge used to discard the previous commit's result).
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: lint · typecheck · unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint (includes ADR-0002 import boundaries)
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests and the coverage gate (src/domain >= 90 % statements)
        run: npm run test:coverage

      - name: Traceability (NFR-T2, Release 1 stories)
        run: npm run traceability

  api:
    name: API tests (Postgres)
    runs-on: ubuntu-latest
    services:
      # The same image as compose.yaml (T-02).
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: personal_finance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d personal_finance"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/personal_finance
      SESSION_SECRET: "ci-only-session-secret-not-a-real-secret-32chars"
      DEMO_EMAIL: "demo@example.com"
      # bcryptjs hash of "ci-demo-password-123" (below) — a fixed demo credential the login
      # page itself displays in production too, not a secret (ADR-0006, NFR-S1), so
      # committing it in a public workflow file is fine. RAW, no `\$` escaping: this value
      # reaches the app as a real process env var, not through a .env* file, and Next's env
      # loader (@next/env's processEnv) returns process.env untouched when it finds no .env
      # file to parse — dotenv-expand never runs, so an escaped `\$` would stay literally in
      # the string and break every login (found and wrongly "fixed" once during T-05's
      # review: escaping is only for values written into a .env* file, e.g. .env.local,
      # where @next/env's dotenv-expand step does run over everything it loads, including a
      # pre-existing process env var of the same name).
      DEMO_PASSWORD_HASH: "$2b$10$/gyfHp0z/Dlr77T6RwYhg.hO1OyLHX.zY9BIwRM6y7bFWNi8SnTM6"
      DEMO_PASSWORD_DISPLAY: "ci-demo-password-123"
      # T-08: /api/admin/reset's two Bearer secrets (SPEC-reset-and-test-support §2.2–2.3).
      # CI-only placeholders that guard nothing real; production's live in Vercel's env.
      RESET_SECRET: "ci-only-reset-secret-not-a-real-secret"
      CRON_SECRET: "ci-only-cron-secret-not-a-real-secret"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install (generates the Prisma client)
        run: npm ci

      - name: Migrate
        run: npx prisma migrate deploy

      - name: API tests (builds and starts the app with APP_ENV=test)
        run: npm run test:api

  e2e:
    name: E2E (${{ matrix.label }}, ${{ matrix['webmcp-mode'] }})
    runs-on: ubuntu-latest
    strategy:
      # One leg failing must not hide another's verdict.
      fail-fast: false
      matrix:
        # SPEC-webmcp-tools §7 / NFR-W2: the app is built once per leg — WEBMCP_MODE is inlined at
        # build time (next.config.ts), so `off` cannot be a runtime switch. ADR-0003: E2E runs on
        # Chromium, Firefox and WebKit. `off` is built once, on Chromium: it registers no tools,
        # and it was measured green on Firefox locally (T-13 plan Q3-A).
        # All four leg names are T-16's required checks; keep them.
        include:
          - { label: Chromium, browser: chromium, webmcp-mode: polyfill }
          - { label: Chromium, browser: chromium, webmcp-mode: "off" }
          - { label: Firefox, browser: firefox, webmcp-mode: polyfill }
          - { label: WebKit, browser: webkit, webmcp-mode: polyfill }
    services:
      # The same database service as the API job (T-02).
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: personal_finance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d personal_finance"
          --health-interval 2s --health-timeout 5s --health-retries 30
    # The API job's env, verbatim — see the comment there on why DEMO_PASSWORD_HASH is raw here
    # (no `\$` escaping: a CI env value reaches the app without passing through a .env file).
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/personal_finance
      SESSION_SECRET: "ci-only-session-secret-not-a-real-secret-32chars"
      DEMO_EMAIL: "demo@example.com"
      DEMO_PASSWORD_HASH: "$2b$10$/gyfHp0z/Dlr77T6RwYhg.hO1OyLHX.zY9BIwRM6y7bFWNi8SnTM6"
      DEMO_PASSWORD_DISPLAY: "ci-demo-password-123"
      # T-08: /api/admin/reset's two Bearer secrets (SPEC-reset-and-test-support §2.2–2.3).
      # CI-only placeholders that guard nothing real; production's live in Vercel's env.
      RESET_SECRET: "ci-only-reset-secret-not-a-real-secret"
      CRON_SECRET: "ci-only-cron-secret-not-a-real-secret"
      # The matrix leg's mode; the mode-specific specs skip themselves in the other one.
      WEBMCP_MODE: ${{ matrix['webmcp-mode'] }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install (generates the Prisma client)
        run: npm ci

      - name: Install ${{ matrix.label }}
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Migrate
        run: npx prisma migrate deploy

      - name: E2E tests, ${{ matrix.label }}, WEBMCP_MODE=${{ matrix['webmcp-mode'] }} (builds and starts the app with APP_ENV=test)
        run: npx playwright test --project=${{ matrix.browser }}

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-e2e-${{ matrix.browser }}-${{ matrix['webmcp-mode'] }}
          path: playwright-report/
          retention-days: 7

  secret-scan:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Every commit, not only the tip. scripts/secret-scan.sh refuses a shallow clone
          # rather than pass on one commit (NFR-S5, T-02a).
          fetch-depth: 0
          persist-credentials: false

      # Gitleaks 8.30.1 through scripts/gitleaks.sh (SHA-256 pinned): every ref, merge
      # commits included, output redacted. A finding exits 1 and fails the job. No SARIF
      # upload: code scanning needs GitHub Code Security, unavailable while the repository
      # is private (backlog T-02a).
      - name: Gitleaks (full history)
        run: scripts/secret-scan.sh history

  audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      # Reads package-lock.json against the registry's advisories and reports high and
      # critical ones without failing the job (owner decision 2026-09-22): the verdict can
      # change with no code change, when an advisory is published, and must not turn an
      # unrelated pull request red. A finding shows as a warning annotation on the run.
      - name: npm audit (high and critical, reported, not blocking)
        run: |
          if ! npm audit --audit-level=high; then
            echo "::warning title=npm audit::npm audit failed or found high or critical advisories; see this step's log"
          fi
